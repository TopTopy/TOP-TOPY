  $('lg').textContent=T().btn;$('born').textContent=(lang==='fa'?'متولد ':'Born ')+new Date(BIRTH.y,BIRTH.m-1,BIRTH.d).toLocaleDateString(lang==='fa'?'fa-IR':'en-US',{year:'numeric',month:'long',day:'numeric'});
  $('msg').textContent=T().tap;$('sh').textContent=num(sh);$('mk').textContent=num(mk);
  Object.keys(last).forEach(k=>delete last[k]);jj=0;ji=0;jdel=0;tick();
  run++;$('code').innerHTML='';if(termStarted)runTerm();
}

/* typewriter */
(function go(){const el=$('job'),w=[...T().jobs[ji%T().jobs.length]];el.textContent=w.slice(0,jj).join('');
  if(!jdel&&jj>=w.length){jdel=1;return setTimeout(go,1500)}if(jdel&&jj<=0){jdel=0;ji++}jj+=jdel?-1:1;setTimeout(go,jdel?40:90)})();

/* terminal */
async function runTerm(){termStarted=1;const id=run,pre=$('code');
  for(const [pf,tx,c] of T().term){if(id!==run)return;const d=document.createElement('div');pre.appendChild(d);d.innerHTML=`<span class="${pf[0]=='$'?'p':'o'}">${pf}</span>`;const s=document.createElement('span');if(c=='k')s.className='k';d.appendChild(s);
    for(const ch of [...(tx==='TOP TOPY'?NAME:tx)]){if(id!==run)return;s.textContent+=ch;await new Promise(r=>setTimeout(r,pf[0]=='$'?55:22))}await new Promise(r=>setTimeout(r,320))}
  if(id===run){const cu=document.createElement('span');cu.className='cur';pre.lastChild.appendChild(cu)}}

/* battery */
function batt(){const v=6+Math.floor(Math.random()*20);$('cell').style.width=v+'%';$('bp').textContent=num(v)+(lang==='fa'?'٪':'%')}
setTimeout(batt,600);setInterval(batt,3500);

/* basketball */
const ball=$('ball');
ball.onclick=()=>{if(busy)return;busy=1;sh++;const make=Math.random()<.6;
  const b=ball.getBoundingClientRect(),r=document.querySelector('.rim').getBoundingClientRect();
  const dx=r.left+r.width/2-b.left-b.width/2+(make?0:(Math.random()<.5?-34:26)),dy=r.top-b.top-12;
  ball.style.animation='none';
  const a=ball.animate([{transform:'translate(0,0) rotate(0)',easing:'cubic-bezier(.15,.7,.4,1)'},{transform:`translate(${dx*.55}px,${dy-60}px) rotate(260deg)`,offset:.5,easing:'cubic-bezier(.6,0,.9,.6)'},{transform:`translate(${dx}px,${dy}px) rotate(560deg)`}],{duration:850,fill:'forwards'});
  a.onfinish=()=>{let n;
    if(make){mk++;streak++;$('net').classList.remove('sw');void $('net').offsetWidth;$('net').classList.add('sw');$('msg').textContent=streak>1?T().streak(num(streak)):T().make;
      n=ball.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:`translate(${dx}px,0px)`}],{duration:380,easing:'ease-in',fill:'forwards'});if(streak==3)confetti()}
    else{streak=0;$('msg').textContent=T().miss;
      n=ball.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:`translate(${dx-(dx>0?40:-40)}px,0px) rotate(900deg)`}],{duration:520,easing:'cubic-bezier(.3,.6,.5,1)',fill:'forwards'})}
    $('sh').textContent=num(sh);$('mk').textContent=num(mk);
    n.onfinish=()=>{ball.getAnimations().forEach(x=>x.cancel());ball.style.animation='';busy=0}}};

/* countdown */
function set(id,v){const e=$(id),t=num(v);if(last[id]!==t){e.textContent=t;last[id]=t;if(id!=='lived'&&id!=='age'){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}}}
function tick(){const now=new Date(),y=now.getFullYear(),today=now.getMonth()===BIRTH.m-1&&now.getDate()===BIRTH.d;
  let t=new Date(y,BIRTH.m-1,BIRTH.d);if(t<now&&!today)t=new Date(y+1,BIRTH.m-1,BIRTH.d);
  const prev=new Date(t.getFullYear()-1,BIRTH.m-1,BIRTH.d),p=today?1:(now-prev)/(t-prev);
  $('pb').style.width=(p*100).toFixed(2)+'%';
  set('lived',Math.floor((now-new Date(BIRTH.y,BIRTH.m-1,BIRTH.d))/864e5));
  set('age',t.getFullYear()-BIRTH.y-(today?0:1));
  if(today){['d','h','m','s'].forEach(k=>set(k,0));$('note').textContent=T().today;if(!fired){fired=1;confetti()}return}
  let diff=t-now;const d=Math.floor(diff/864e5);diff%=864e5;const h=Math.floor(diff/36e5);diff%=36e5;
  set('d',d);set('h',h);set('m',Math.floor(diff/6e4));set('s',Math.floor(diff%6e4/1e3));
  $('note').textContent=T().path(num(Math.round(p*100)),num(t.getFullYear()-BIRTH.y))}
setInterval(tick,1000);

/* reveal, spotlight, tilt */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');if(e.target.classList.contains('term')&&!termStarted)runTerm();io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll('.t').forEach((el,i)=>{el.style.transitionDelay=(i*60)+'ms';io.observe(el);
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    el.style.setProperty('--mx',x*100+'%');el.style.setProperty('--my',y*100+'%');
    if(e.pointerType==='mouse'){el.style.setProperty('--ry',((x-.5)*7)+'deg');el.style.setProperty('--rx',((.5-y)*7)+'deg')}});
  el.addEventListener('pointerleave',()=>{el.style.setProperty('--rx','0deg');el.style.setProperty('--ry','0deg')});
  el.addEventListener('transitionend',()=>{el.style.transitionDelay='0ms'},{once:true})});

/* particles */
const bg=$('bg'),bx=bg.getContext('2d');let W,H,P=[],mp={x:-999,y:-999};
function rs(){W=bg.width=innerWidth;H=bg.height=innerHeight;P=Array.from({length:Math.min(60,W/9|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}))}
rs();addEventListener('resize',rs);addEventListener('pointermove',e=>{mp={x:e.clientX,y:e.clientY}});
(function loop(){bx.clearRect(0,0,W,H);const c=getComputedStyle(document.documentElement).getPropertyValue('--dot').trim()||'255,255,255';
P.forEach((a,i)=>{a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;
  const dm=Math.hypot(a.x-mp.x,a.y-mp.y);if(dm<120){a.x+=(a.x-mp.x)/dm*1.2;a.y+=(a.y-mp.y)/dm*1.2}
  bx.fillStyle=`rgba(${c},.7)`;bx.beginPath();bx.arc(a.x,a.y,1.6,0,7);bx.fill();
  for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<100){bx.strokeStyle=`rgba(${c},${.22*(1-d/100)})`;bx.beginPath();bx.moveTo(a.x,a.y);bx.lineTo(b.x,b.y);bx.stroke()}}});
requestAnimationFrame(loop)})();

/* confetti */
function confetti(){const cv=$('cf'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=[PAL[pi].c1,PAL[pi].c2,PAL[pi].c3,'#fff',PAL[pi].c2];
  const ps=Array.from({length:160},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:4+Math.random()*5,c:cols[Math.random()*5|0],a:Math.random()*6}));
  (function f(){x.clearRect(0,0,cv.width,cv.height);let l=0;ps.forEach(q=>{q.vy+=.3;q.x+=q.vx;q.y+=q.vy;q.a+=.2;if(q.y<cv.height+20){l=1;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;x.fillRect(-q.r/2,-q.r/2,q.r,q.r*1.5);x.restore()}});if(l)requestAnimationFrame(f)})()}
$('orb').addEventListener('click',confetti);
/* auto theme cycle */
const PAL=[
{bg:'#000',tile:'rgba(255,255,255,.05)',bd:'rgba(255,255,255,.14)',text:'#fff',muted:'#a3a3a3',chip:'rgba(255,255,255,.07)',c1:'#8a8a8a',c2:'#cfcfcf',c3:'#fff',glow:'rgba(255,255,255,.22)',dot:'255,255,255'},
{bg:'#02070c',tile:'rgba(255,255,255,.05)',bd:'rgba(94,234,212,.2)',text:'#eafcff',muted:'#8fb8c4',chip:'rgba(94,234,212,.07)',c1:'#2f7bff',c2:'#38bdf8',c3:'#5eead4',glow:'rgba(56,189,248,.34)',dot:'94,234,212'},
{bg:'#030a0a',tile:'rgba(255,255,255,.05)',bd:'rgba(255,255,255,.1)',text:'#effffa',muted:'#9bc2b6',chip:'rgba(255,255,255,.07)',c1:'#7c5cff',c2:'#ff3d9a',c3:'#2dff9a',glow:'rgba(45,255,154,.35)',dot:'45,255,154'},
{bg:'#0a0504',tile:'rgba(255,255,255,.05)',bd:'rgba(255,170,100,.2)',text:'#fff5ee',muted:'#c9a898',chip:'rgba(255,150,80,.08)',c1:'#7c3aed',c2:'#ff3d6e',c3:'#ff9a3d',glow:'rgba(255,122,24,.38)',dot:'255,150,70'}];
let pi=0,auto=1,timer;
function applyPal(i){pi=i%PAL.length;const r=document.documentElement.style,p=PAL[pi];for(const k in p)r.setProperty('--'+k,p[k])}
function startCycle(){clearInterval(timer);timer=setInterval(()=>applyPal(pi+1),(CFG.theme.every||5)*1000)}
applyPal(CFG.theme.mode==='fixed'?CFG.theme.fixed:0);if(CFG.theme.mode==='fixed')$('tg').style.display='none';else{startCycle();$('tg').textContent='⏸'}
$('tg').addEventListener('click',()=>{auto=!auto;$('tg').textContent=auto?'⏸':'▶';if(auto){applyPal(pi+1);startCycle()}else clearInterval(timer)});
$('lg').addEventListener('click',()=>{lang=lang==='en'?'fa':'en';try{localStorage.setItem('lang',lang)}catch(e){}render()});
render();

/* dynamic content from CFG */
function renderDyn(){
  const h=$('nm');h.textContent=NAME;h.setAttribute('data-t',NAME);document.title=NAME;
  document.querySelector('p[data-i=about]').textContent=(CFG.about&&CFG.about[lang])||T().about;
  document.querySelector('.orb .av').innerHTML=CFG.photos.me?`<img src="${esc(CFG.photos.me)}" alt="">`:esc(NAME.split(/\s+/).map(w=>[...w][0]||'').join('').slice(0,2).toUpperCase()||'TT');
  $('friends').innerHTML=CFG.friends.map(f=>{const m=/t\.me\/([^\/?#]+)/.exec(f.url||''),sub=m?'@'+m[1]:(lang==='fa'?'باز کردن چت':'Open chat'),nm=f[lang]||f.en||f.fa||'';
    return `<a class="f" href="${esc(f.url)}" target="_blank" rel="noopener"><i>${f.photo?`<img src="${esc(f.photo)}" alt="">`:esc([...nm][0]||'?')}</i><b>${esc(nm)}</b><small>${esc(sub)}</small></a>`}).join('');
  const ls=[{l:lang==='fa'?'پیام ناشناس 🤫':'Anonymous Messages 🤫',u:CFG.contact.bot}];
  if(CFG.contact.tg)ls.push({l:lang==='fa'?'پیام در تلگرام ✈️':'Message me ✈️',u:'https://t.me/'+CFG.contact.tg.replace('@','')});
  (CFG.contact.links||[]).forEach(x=>ls.push({l:x[lang]||x.en||x.fa,u:x.url}));
  $('links').innerHTML=ls.filter(x=>x.u).map(x=>`<a class="btn" href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.l)}</a>`).join('');
  const S=CFG.song,has=S.title||S.link||S.audio;$('songT').hidden=!has;if(!has)return;
  $('stt').textContent=S.title||'';$('sar').textContent=S.artist||'';
  $('cv').innerHTML=S.cover?`<img src="${esc(S.cover)}" alt="">`:'🎵';
  const l=$('lsn');if(S.link){l.href=S.link;l.hidden=false;l.textContent=T().listen}else l.hidden=true;
  const au=$('au'),b=$('plb');if(S.audio){if(au.getAttribute('src')!==S.audio)au.src=S.audio;b.hidden=false}else b.hidden=true}
$('plb').onclick=()=>{const a=$('au');a.paused?a.play().catch(()=>{}):a.pause()};
$('au').onplay=()=>{$('plb').textContent='⏸'};$('au').onpause=()=>{$('plb').textContent='▶'};
renderDyn();


</script></body></html>
